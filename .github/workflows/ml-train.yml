name: ml-train

# Trains the forecast models on the real station archive and shows the scores
# in the run's summary: each task with and without weather-model guidance,
# against the raw guidance, climatology and persistence.
#
# The database comes from the hourly site run's cache (pages.yml), so no
# WeatherLink secrets are needed. As-issued guidance is read from the
# weather-history branch (guidance/), which the site run keeps up to date;
# months it lacks are fetched here but not saved. The station's position is read from the database and sent
# only to Open-Meteo, rounded to about 1 km; it is never printed.

on:
  pull_request:
    paths: ['ml/wxml/**', 'ml/requirements.txt', '.github/workflows/ml-train.yml']
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - run: pip install -r ml/requirements.txt

      - name: Restore station database
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: data/weather.db
          key: weather-db-${{ github.run_id }}
          restore-keys: weather-db-

      - name: Check the database
        if: ${{ steps.restore-db.outputs.cache-matched-key == '' }}
        run: |
          echo "::error::No station database in the cache yet; let the hourly 'Publish site' workflow run first."
          exit 1

      - name: Check out the history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch weather-history "$remote" history \
            || { echo "::warning::No weather-history branch yet; fetching guidance afresh."; mkdir -p history; }

      - name: Fetch new guidance months
        # Months already saved stay usable if Open-Meteo is slow today; the next run fetches the rest.
        continue-on-error: true
        working-directory: ml
        run: python -m wxml --db ../data/weather.db --guidance-dir ../history/guidance guidance-sync

      - name: Fetch new neighbour months
        continue-on-error: true
        working-directory: ml
        run: python -m wxml --db ../data/weather.db --neighbours-dir ../history/neighbours neighbours-sync

      - name: Train and score
        working-directory: ml
        run: python -m wxml --db ../data/weather.db --guidance-dir ../history/guidance --neighbours-dir ../history/neighbours train

      - name: Scores
        working-directory: ml
        run: |
          {
            echo "## Forecast models on the station's last 12 months"
            echo
            python -m wxml scores
            echo
            echo "Weather data by Open-Meteo.com (CC BY 4.0)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: ml/out/metrics.json
