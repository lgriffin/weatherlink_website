# Publishes the site to GitHub Pages every hour.
#
# Each run tops up the station database from WeatherLink, rebuilds the derived
# data, then publishes the web app with a JSON snapshot of every page's data.
# The database is kept between runs in the Actions cache, so only the first
# run downloads the full history (about 15 minutes per year of data).
#
# The raw history is also committed to the weather-history branch as plain
# files (see its README). That branch is the durable copy: when the cache is
# gone, the database is rebuilt from it instead of downloading everything
# again, and it can be cloned onto a NAS or synced to Drive as it is.
#
# One-time setup: Settings > Pages > Source: "GitHub Actions", and repository
# secrets WEATHERLINK_API_KEY and WEATHERLINK_API_SECRET. Optionally set the
# repository variable WEATHERLINK_STATION_ID if the account has several stations,
# and PUBLIC_LOCATION (exact, approximate or hidden) for the Map page's station spot.
name: Publish site

on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the weather-history branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_PATH: ${{ github.workspace }}/data/weather.db
      WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
      WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
      WEATHERLINK_STATION_ID: ${{ vars.WEATHERLINK_STATION_ID }}
      APP_TIMEZONE: Europe/Dublin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check WeatherLink secrets
        run: |
          if [ -z "$WEATHERLINK_API_KEY" ] || [ -z "$WEATHERLINK_API_SECRET" ]; then
            echo "::error::Add the WEATHERLINK_API_KEY and WEATHERLINK_API_SECRET repository secrets."
            exit 1
          fi

      - name: Restore station database
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: data/weather.db
          key: weather-db-${{ github.run_id }}
          restore-keys: weather-db-

      - name: Check out the history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth 1 --branch weather-history "$remote" history; then
            echo "No weather-history branch yet; this run starts it."
            git init --quiet -b weather-history history
            git -C history remote add origin "$remote"
          fi

      - name: Prepare database
        run: |
          mkdir -p data
          touch .env
          pnpm db:migrate

      - name: Load the history branch into a fresh database
        if: ${{ steps.restore-db.outputs.cache-matched-key == '' && hashFiles('history/format.json') != '' }}
        run: pnpm archive:import --from history

      - name: Download new archive days
        run: pnpm archive:harvest

      - name: Fetch current conditions
        run: pnpm --filter @weather/worker archive current

      - name: Rebuild summaries and records
        run: pnpm archive:rebuild

      - name: List outages for the Outputs page
        run: pnpm archive:gaps --save

      - name: List wind sensor outages
        run: pnpm archive:gaps --measurement wind.speed --min-hours 24

      - name: Save the history to the weather-history branch
        if: ${{ !cancelled() }}
        run: |
          pnpm archive:export --to history
          cd history
          git add -A
          if git diff --cached --quiet; then
            echo "History unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "History up to $(date -u -d yesterday +%F)"
          git push --quiet origin HEAD:weather-history

      - name: Save station database
        if: ${{ !cancelled() && hashFiles('data/weather.db') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/weather.db
          key: weather-db-${{ github.run_id }}

      - name: Build the site
        run: pnpm --filter @weather/web build
        env:
          VITE_STATIC: 'true'
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Snapshot the data
        env:
          # exact, approximate (default: a 0.1° grid cell, about a town) or hidden.
          PUBLIC_LOCATION: ${{ vars.PUBLIC_LOCATION }}
        run: |
          pnpm --filter @weather/api snapshot "$GITHUB_WORKSPACE/apps/web/dist/data"
          # Let deep links (e.g. /records) load the app instead of a 404 page.
          cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
