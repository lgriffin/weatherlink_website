# Publishes the site to GitHub Pages every hour.
#
# Each run tops up the station database from WeatherLink, rebuilds the derived
# data, then publishes the web app with a JSON snapshot of every page's data.
# The database is kept between runs in the Actions cache, so only the first
# run downloads the full history (about 15 minutes per year of data).
#
# The raw history is also committed to the weather-history branch as plain
# files (see its README). That branch is the durable copy: when the cache is
# gone, the database is rebuilt from it instead of downloading everything
# again, and it can be cloned onto a NAS or synced to Drive as it is.
#
# Once a day, the first run after 18:00 local time also makes tonight's
# forecast (ml/): it saves the weather models' past runs and the neighbours'
# readings, retrains, issues the
# forecast into the ledger (history branch, forecasts/), scores past ones and
# loads the forecast and model scores into the database for the site.
#
# One-time setup: Settings > Pages > Source: "GitHub Actions", and repository
# secrets WEATHERLINK_API_KEY and WEATHERLINK_API_SECRET. Optionally set the
# repository variable WEATHERLINK_STATION_ID if the account has several stations,
# and PUBLIC_LOCATION (exact, approximate or hidden) for the Map page's station spot.
name: Publish site

on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      forecast:
        description: Make the forecast now if it is due, even before 18:00
        type: boolean
        default: false

permissions:
  contents: write # push the weather-history branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_PATH: ${{ github.workspace }}/data/weather.db
      WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
      WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
      WEATHERLINK_STATION_ID: ${{ vars.WEATHERLINK_STATION_ID }}
      APP_TIMEZONE: Europe/Dublin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check WeatherLink secrets
        run: |
          if [ -z "$WEATHERLINK_API_KEY" ] || [ -z "$WEATHERLINK_API_SECRET" ]; then
            echo "::error::Add the WEATHERLINK_API_KEY and WEATHERLINK_API_SECRET repository secrets."
            exit 1
          fi

      - name: Restore station database
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: data/weather.db
          key: weather-db-${{ github.run_id }}
          restore-keys: weather-db-

      - name: Check out the history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth 1 --branch weather-history "$remote" history; then
            echo "No weather-history branch yet; this run starts it."
            git init --quiet -b weather-history history
            git -C history remote add origin "$remote"
          fi

      - name: Prepare database
        run: |
          mkdir -p data
          touch .env
          pnpm db:migrate

      - name: Load the history branch into a fresh database
        if: ${{ steps.restore-db.outputs.cache-matched-key == '' && hashFiles('history/format.json') != '' }}
        run: pnpm archive:import --from history

      - name: Download new archive days
        run: pnpm archive:harvest

      - name: Fetch current conditions
        run: pnpm --filter @weather/worker archive current

      - name: Rebuild summaries and records
        run: pnpm archive:rebuild

      - name: List outages for the Outputs page
        run: pnpm archive:gaps --save

      - name: List wind sensor outages
        run: pnpm archive:gaps --measurement wind.speed --min-hours 24

      - name: Is tonight's forecast due?
        id: forecast
        run: |
          hour=$(TZ="$APP_TIMEZONE" date +%-H)
          if [ "$hour" -ge 18 ] || [ "${{ inputs.forecast }}" = "true" ]; then
            echo "evening=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: ${{ steps.forecast.outputs.evening == 'true' }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Forecast tonight
        if: ${{ steps.forecast.outputs.evening == 'true' }}
        # A forecast problem must never stop the site publishing.
        continue-on-error: true
        working-directory: ml
        run: |
          pip install -q -r requirements.txt
          ledger="$GITHUB_WORKSPACE/history/forecasts"
          dirs=(--guidance-dir "$GITHUB_WORKSPACE/history/guidance" --neighbours-dir "$GITHUB_WORKSPACE/history/neighbours")
          outputs="$GITHUB_WORKSPACE/site-outputs"
          if python -m wxml due --ledger "$ledger"; then
            python -m wxml "${dirs[@]}" guidance-sync || echo "::warning::Open-Meteo guidance sync failed; training on what is saved."
            python -m wxml "${dirs[@]}" neighbours-sync || echo "::warning::Neighbour sync failed; training on what is saved."
            python -m wxml "${dirs[@]}" train
            python -m wxml "${dirs[@]}" issue --ledger "$ledger" --publish "$outputs" --with-scores
            python -m wxml verify --ledger "$ledger"
          else
            # Met Éireann's stations only offer today's readings to the runners: keep them each hour.
            python -m wxml "${dirs[@]}" neighbours-sync --recent-only || echo "::warning::Could not keep the neighbours' readings."
            # Already issued: send it again as issued, in case loading it into the site failed last time.
            python -m wxml issue --ledger "$ledger" --publish "$outputs" --guidance none || exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          args=()
          for kind in forecast model-scores; do
            [ -f "site-outputs/$kind.json" ] && args+=("$kind" "$GITHUB_WORKSPACE/site-outputs/$kind.json")
          done
          if [ ${#args[@]} -gt 0 ]; then pnpm --filter @weather/api ingest-file "${args[@]}"; fi

      - name: Save the history to the weather-history branch
        if: ${{ !cancelled() }}
        run: |
          pnpm archive:export --to history
          cd history
          git add -A
          if git diff --cached --quiet; then
            echo "History unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "History up to $(date -u -d yesterday +%F)"
          for attempt in 1 2 3 4; do
            git push --quiet origin HEAD:weather-history && exit 0
            sleep $((attempt * 5))
            git pull --quiet --rebase origin weather-history
          done
          exit 1

      - name: Save station database
        if: ${{ !cancelled() && hashFiles('data/weather.db') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/weather.db
          key: weather-db-${{ github.run_id }}

      - name: Build the site
        run: pnpm --filter @weather/web build
        env:
          VITE_STATIC: 'true'
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Snapshot the data
        env:
          # exact, approximate (default: a 0.1° grid cell, about a town) or hidden.
          PUBLIC_LOCATION: ${{ vars.PUBLIC_LOCATION }}
        run: |
          pnpm --filter @weather/api snapshot "$GITHUB_WORKSPACE/apps/web/dist/data"
          # Let deep links (e.g. /records) load the app instead of a 404 page.
          cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
