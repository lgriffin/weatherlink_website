name: neighbours-live

# Checks that the Met Éireann and Irish weather buoy adapters still understand
# the real services. Runs weekly, when those adapters change, and on demand.
# The forecast check asks about a public reference point (Dublin city centre),
# never the station.

on:
  pull_request:
    paths:
      - 'ml/wxml/adapters/irish_buoys.py'
      - 'ml/wxml/adapters/met_eireann.py'
      - 'ml/wxml/adapters/http.py'
      - '.github/workflows/neighbours-live.yml'
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neighbours-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Irish weather buoys (ERDDAP)
        run: |
          python - <<'PY'
          import pandas as pd
          from wxml.adapters.irish_buoys import IrishBuoys
          day = pd.Timestamp.now(tz='UTC').floor('D') - pd.Timedelta(days=3)
          frame = IrishBuoys().hourly(f'{day:%Y-%m-%d}', f'{day + pd.Timedelta(days=1):%Y-%m-%d}')
          print(frame.groupby('site')[['pressure', 'temp', 'wind', 'gust']].agg(['count', 'mean']).round(1))
          assert frame['site'].nunique() >= 3, 'fewer than 3 buoys reporting'
          assert frame['pressure'].between(940, 1060).mean() > 0.8, 'pressures look wrong'
          assert frame['wind'].dropna().between(0, 45).all(), 'winds look wrong (units?)'
          recent = IrishBuoys().recent(24)
          print(f'last 24 h: {len(recent)} readings from {recent["site"].nunique()} buoys')
          PY
      - name: Can the runner reach Met Éireann?
        if: ${{ !cancelled() }}
        run: |
          for host in cli.fusio.net prodapi.metweb.ie openaccess.pf.api.met.ie; do
            echo "== $host"; getent ahosts "$host" | awk '{print $1}' | sort -u
            curl -sS -o /dev/null -w 'HTTP %{http_code} via %{remote_ip} in %{time_total}s\n' --max-time 30 "https://$host/" || true
          done
      - name: Met Éireann station history (climate data)
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import pandas as pd
          from wxml.adapters.met_eireann import MetEireannObservations
          day = pd.Timestamp.now(tz='UTC').floor('D') - pd.Timedelta(days=45)
          frame = MetEireannObservations(stations={'valentia': 2275, 'dublin-airport': 532}).hourly(
              f'{day:%Y-%m-%d}', f'{day + pd.Timedelta(days=2):%Y-%m-%d}')
          print(frame.groupby('site')[['pressure', 'temp', 'wind', 'rain']].agg(['count', 'mean']).round(1))
          assert set(frame['site']) == {'valentia', 'dublin-airport'}, 'a station is missing'
          assert frame['pressure'].between(940, 1060).mean() > 0.9, 'pressures look wrong'
          assert frame['temp'].between(-15, 35).mean() > 0.9, 'temperatures look wrong'
          PY
      - name: Met Éireann today's observations
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          from wxml.adapters.met_eireann import MetEireannObservations
          frame = MetEireannObservations(stations={'valentia': 2275, 'dublin-airport': 532}).recent(24)
          print(frame.tail(6).to_string())
          assert len(frame) > 0, "no readings from today's observations"
          assert frame['pressure'].dropna().between(940, 1060).all(), 'pressures look wrong'
          PY
      - name: Met Éireann point forecast
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          from wxml.adapters.met_eireann import MetEireannForecastSource
          from wxml.forecasting.domain import Location
          frame = MetEireannForecastSource().latest(Location(53.35, -6.26), hours=48)
          print(frame[['hour', 'temp', 'rain', 'wind', 'gust', 'cloud', 'pressure']].head(12).to_string())
          assert frame['temp'].notna().sum() >= 40, 'fewer than 40 hours of temperature'
          assert frame['rain'].notna().sum() >= 24, 'fewer than 24 hours of rain'
          assert frame['temp'].between(-20, 35).all(), 'temperatures look wrong'
          PY
