name: ml

# Tests for the Python forecasting code in ml/. The live Open-Meteo check
# is separate (open-meteo-live.yml) so an outage there can't block a PR.

on:
  pull_request:
    paths: ['ml/**', '.github/workflows/ml.yml']
  push:
    branches: [main]
    paths: ['ml/**', '.github/workflows/ml.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
