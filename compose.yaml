services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}
      POSTGRES_DB: weather
    ports:
      - '5432:5432'
    volumes:
      - weather-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weather -d weather']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      target: production
    ports:
      - '1456:1456'
    environment:
      PORT: '1456'
      NODE_ENV: production
      APP_TIMEZONE: Europe/Dublin
      LOG_LEVEL: info
      WEATHERLINK_API_KEY: ${WEATHERLINK_API_KEY}
      WEATHERLINK_API_SECRET: ${WEATHERLINK_API_SECRET}
      WEATHERLINK_BASE_URL: https://api.weatherlink.com/v2
      DATABASE_URL: postgresql://weather:${POSTGRES_PASSWORD:-weather}@db:5432/weather
      CURRENT_POLL_INTERVAL_MS: '60000'
      METRICS_ENABLED: 'true'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      target: production
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      NODE_ENV: production
      APP_TIMEZONE: Europe/Dublin
      LOG_LEVEL: info
      WEATHERLINK_API_KEY: ${WEATHERLINK_API_KEY}
      WEATHERLINK_API_SECRET: ${WEATHERLINK_API_SECRET}
      WEATHERLINK_BASE_URL: https://api.weatherlink.com/v2
      DATABASE_URL: postgresql://weather:${POSTGRES_PASSWORD:-weather}@db:5432/weather
      CURRENT_POLL_INTERVAL_MS: '60000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  weather-db:
