services:
  api:
    build:
      context: .
      target: production
    ports:
      - '1456:1456'
    environment:
      PORT: '1456'
      NODE_ENV: production
      APP_TIMEZONE: Europe/Dublin
      LOG_LEVEL: info
      WEATHERLINK_API_KEY: ${WEATHERLINK_API_KEY}
      WEATHERLINK_API_SECRET: ${WEATHERLINK_API_SECRET}
      WEATHERLINK_BASE_URL: https://api.weatherlink.com/v2
      DATABASE_PATH: /data/weather.db
      CURRENT_POLL_INTERVAL_MS: '60000'
      METRICS_ENABLED: 'true'
    volumes:
      - weather-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      target: production
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      NODE_ENV: production
      APP_TIMEZONE: Europe/Dublin
      LOG_LEVEL: info
      WEATHERLINK_API_KEY: ${WEATHERLINK_API_KEY}
      WEATHERLINK_API_SECRET: ${WEATHERLINK_API_SECRET}
      WEATHERLINK_BASE_URL: https://api.weatherlink.com/v2
      DATABASE_PATH: /data/weather.db
      CURRENT_POLL_INTERVAL_MS: '60000'
    volumes:
      - weather-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  weather-data:
